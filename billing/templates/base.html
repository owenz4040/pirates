<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Pirates Billing{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #090a0f;
    --panel: rgba(18, 22, 33, 0.7);
    --panel-hover: rgba(26, 32, 48, 0.8);
    --panel-2: rgba(30, 37, 56, 0.6);
    --border: rgba(255, 255, 255, 0.08);
    --border-gold: rgba(201, 162, 75, 0.4);
    --text: #f0f2f5;
    --muted: #949eb5;
    --gold: #dfb758;
    --gold-soft: rgba(223, 183, 88, 0.15);
    --gold-glow: 0 0 15px rgba(223, 183, 88, 0.3);
    --blue: #5b9dff;
    --green: #4ade80;
    --amber: #f59e0b;
    --red: #f87171;
    
    --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --sidebar-width: 260px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(223, 183, 88, 0.05), transparent 25%),
      radial-gradient(circle at 85% 30%, rgba(91, 157, 255, 0.04), transparent 25%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }
  
  /* Sidebar Drawer */
  .sidebar {
    width: var(--sidebar-width);
    background: rgba(9, 10, 15, 0.95);
    border-right: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 200;
    display: flex;
    flex-direction: column;
    padding: 24px 0;
    transition: transform 0.3s ease;
  }
  .brand { display: flex; align-items: center; gap: 12px; color: var(--text); text-decoration: none; padding: 0 24px 30px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .brand .mark {
    width: 32px; height: 32px; border: 1.5px solid var(--gold); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 15px; flex-shrink: 0;
    box-shadow: var(--gold-glow);
  }
  .brand .name { font-weight: 600; font-size: 1.2rem; letter-spacing: 0.03em; }
  
  .nav-menu { display: flex; flex-direction: column; gap: 8px; padding: 0 16px; flex-grow: 1; }
  .nav-menu a { 
    color: var(--muted); font-weight: 500; text-decoration: none; font-size: 0.95rem; 
    padding: 12px 16px; border-radius: 10px; transition: var(--transition);
    display: flex; align-items: center; gap: 12px;
  }
  .nav-menu a:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .nav-menu a.active { color: var(--gold); background: var(--gold-soft); font-weight: 600; }
  
  .logout-form { padding: 20px 24px 0; border-top: 1px solid var(--border); }
  .logout-form button {
    width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text);
    padding: 10px 16px; font-size: 0.85rem; font-weight: 500; border-radius: 8px; transition: var(--transition);
  }
  .logout-form button:hover { background: rgba(248, 113, 113, 0.1); border-color: var(--red); color: var(--red); }
  
  /* Main Content Area */
  .main-wrapper {
    flex-grow: 1;
    margin-left: var(--sidebar-width);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .mobile-header {
    display: none;
    align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    background: rgba(9, 10, 15, 0.9); backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 100;
  }
  .hamburger { background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; padding: 0; }
  
  main { max-width: 1100px; width: 100%; margin: 0 auto; padding: 40px 32px 80px; }
  h1 { font-weight: 600; font-size: 1.8rem; margin: 0 0 24px; color: var(--text); letter-spacing: 0.02em; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h2 { font-size: 0.85rem; margin: 40px 0 16px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; }
  
  /* Glass Panel */
  .panel { 
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px; 
    padding: 24px; margin-bottom: 24px; backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2); transition: var(--transition);
  }
  
  /* Stats Grid */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 36px; }
  .stat-card { 
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px; 
    padding: 20px; backdrop-filter: blur(10px); transition: var(--transition);
    position: relative; overflow: hidden;
  }
  .stat-card:hover { transform: translateY(-3px); border-color: var(--gold-soft); background: var(--panel-hover); }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0; transition: var(--transition); }
  .stat-card:hover::before { opacity: 1; }
  .stat-card .stat-label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; font-weight: 600; }
  .stat-card .stat-value { font-weight: 600; font-size: 2rem; color: var(--text); text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
  
  /* Tables */
  .table-wrapper { width: 100%; overflow-x: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th, td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
  th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; background: rgba(0,0,0,0.2); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  
  a.row-link { color: var(--text); text-decoration: none; font-weight: 500; transition: var(--transition); }
  a.row-link:hover { color: var(--gold); }
  
  /* Badges */
  .badge { display: inline-flex; align-items: center; justify-content: center; padding: 4px 12px; border-radius: 99px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  .badge.active, .badge.confirmed { background: rgba(74, 222, 128, 0.15); color: var(--green); border: 1px solid rgba(74, 222, 128, 0.2); box-shadow: 0 0 10px rgba(74, 222, 128, 0.1); }
  .badge.suspended, .badge.expired, .badge.pending { background: rgba(245, 158, 11, 0.15); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.2); box-shadow: 0 0 10px rgba(245, 158, 11, 0.1); }
  .badge.online { background: rgba(91, 157, 255, 0.15); color: var(--blue); border: 1px solid rgba(91, 157, 255, 0.2); box-shadow: 0 0 10px rgba(91, 157, 255, 0.1); }
  .badge.offline { background: rgba(255, 255, 255, 0.08); color: var(--muted); border: 1px solid rgba(255, 255, 255, 0.1); }
  .badge.failed { background: rgba(248, 113, 113, 0.15); color: var(--red); border: 1px solid rgba(248, 113, 113, 0.2); box-shadow: 0 0 10px rgba(248, 113, 113, 0.1); }
  
  /* Forms */
  .field-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  .field-row > div { flex: 1; min-width: 200px; }
  label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
  .panel-title { color: var(--text); font-size: 1.1rem; letter-spacing: 0.02em; margin-bottom: 20px; display: block; font-weight: 600; }
  
  input, select {
    width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 12px 14px; font-size: 0.95rem; transition: var(--transition);
    font-family: inherit;
  }
  input[type="checkbox"] { width: auto; margin-right: 8px; transform: scale(1.2); }
  .checkbox-label { display: inline-flex; align-items: center; text-transform: none; letter-spacing: normal; font-size: 0.9rem; color: var(--text); cursor: pointer; }
  
  input:focus, select:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); background: rgba(0,0,0,0.4); }
  
  button {
    background: linear-gradient(135deg, var(--gold), #b8913e); color: #000; border: none; border-radius: 10px;
    padding: 12px 24px; font-size: 0.95rem; font-weight: 600; cursor: pointer; letter-spacing: 0.03em;
    transition: var(--transition); box-shadow: 0 4px 15px rgba(223, 183, 88, 0.2); font-family: inherit;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(223, 183, 88, 0.3); }
  button:active { transform: translateY(0); }
  
  button.secondary { background: rgba(255,255,255,0.08); color: var(--text); box-shadow: none; }
  button.secondary:hover { background: rgba(255,255,255,0.15); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
  
  button.danger { background: linear-gradient(135deg, var(--red), #dc2626); color: #fff; box-shadow: 0 4px 15px rgba(248, 113, 113, 0.2); }
  button.danger:hover { box-shadow: 0 6px 20px rgba(248, 113, 113, 0.3); }
  
  form.inline { display: inline-block; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0 30px; }
  
  .flash { padding: 16px 20px; border-radius: 12px; margin-bottom: 30px; font-size: 0.95rem; white-space: pre-wrap; font-weight: 500; backdrop-filter: blur(10px); display: flex; align-items: center; gap: 12px; animation: slideIn 0.4s ease-out; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  .flash.ok { background: rgba(74, 222, 128, 0.1); border: 1px solid rgba(74, 222, 128, 0.3); color: var(--green); }
  .flash.error { background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.3); color: var(--red); }
  
  .muted { color: var(--muted); font-size: 0.85rem; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
  
  /* Filter Tabs */
  .filter-tabs { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .filter-tab { 
    background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--muted);
    padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
    text-decoration: none; transition: var(--transition);
  }
  .filter-tab:hover { background: rgba(255,255,255,0.1); color: var(--text); }
  .filter-tab.active { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
  
  /* Mobile Responsiveness */
  @media (max-width: 900px) {
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main-wrapper { margin-left: 0; }
    .mobile-header { display: flex; }
    
    .grid-2 { grid-template-columns: 1fr; }
    .stat-grid { grid-template-columns: 1fr; }
    main { padding: 24px 16px 60px; }
    
    /* Mobile Card Tables */
    .table-wrapper { background: transparent; border: none; box-shadow: none; padding: 0; }
    table, thead, tbody, th, td, tr { display: block; }
    thead tr { position: absolute; top: -9999px; left: -9999px; }
    tr { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 16px; padding: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    tr:hover td { background: transparent; }
    td { border: none; border-bottom: 1px solid rgba(255,255,255,0.05); position: relative; padding-left: 45%; min-height: 48px; display: flex; align-items: center; justify-content: flex-end; text-align: right; }
    td:last-child { border-bottom: none; justify-content: flex-end; }
    td::before {
      content: attr(data-label);
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      width: 40%; white-space: nowrap; font-weight: 600; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; text-align: left;
    }
  }
</style>
<script>
  function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('open');
  }
</script>
</head>
<body>

<aside class="sidebar">
  <a class="brand" href="/dashboard">
    <span class="mark">&#10022;</span>
    <span class="name">Pirates Wifi</span>
  </a>
  <nav class="nav-menu">
    <a href="/dashboard" class="{% if request.url.path == '/dashboard' %}active{% endif %}">Dashboard</a>
    <a href="/dashboard/customers/new" class="{% if request.url.path == '/dashboard/customers/new' %}active{% endif %}">Add Customer</a>
    <a href="/dashboard/plans" class="{% if request.url.path == '/dashboard/plans' %}active{% endif %}">Plans</a>
  </nav>
  <form class="logout-form" method="post" action="/logout">
    <button type="submit">Sign out</button>
  </form>
</aside>

<div class="main-wrapper">
  <header class="mobile-header">
    <a class="brand" href="/dashboard" style="margin: 0; padding: 0; border: none;">
      <span class="mark" style="width: 24px; height: 24px; font-size: 12px;">&#10022;</span>
      <span class="name" style="font-size: 1.1rem;">Pirates Wifi</span>
    </a>
    <button class="hamburger" onclick="toggleSidebar()">&#9776;</button>
  </header>
  
  <main>
    {% if flash %}
      <div class="flash {{ flash_kind or 'ok' }}">{{ flash }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</div>

</body>
</html>
