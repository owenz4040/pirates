<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISP Admin Login — COwen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --panel: rgba(18, 22, 33, 0.9);
      --border: rgba(255, 255, 255, 0.08);
      --border-gold: rgba(223, 183, 88, 0.4);
      --gold: #dfb758;
      --gold-dark: #b8913e;
      --gold-glow: rgba(223, 183, 88, 0.2);
      --text: #f0f2f5;
      --text-muted: #949eb5;
      --red: #f87171;
      --radius-sm: 8px;
      --radius-md: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      background-image: radial-gradient(circle at 50% 20%, rgba(223, 183, 88, 0.06), transparent 40%);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
    }
    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #090a0f;
      font-weight: 800;
      font-size: 24px;
      margin-bottom: 16px;
      box-shadow: 0 0 20px var(--gold-glow);
    }
    .brand-title {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
    }
    .brand-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(10, 12, 18, 0.9);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      transition: all 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 12px var(--gold-glow);
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #090a0f;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      box-shadow: 0 0 20px var(--gold-glow);
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn-submit:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .alert {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      font-size: 13px;
    }
    .alert-error {
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: var(--red);
    }
    .alert-info {
      background: rgba(74, 222, 128, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.3);
      color: #4ade80;
    }
    .footer-links {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .footer-links a {
      color: var(--gold);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-header">
      <div class="brand-icon">C</div>
      <h1 class="brand-title">COwen ISP SaaS</h1>
      <p class="brand-desc">Tenant ISP Administration Console</p>
    </div>

    {% if error %}
    <div class="alert alert-error">
      <span>⚠ {{ error }}</span>
    </div>
    {% endif %}

    {% if msg %}
    <div class="alert alert-info">
      <span>✓ {{ msg }}</span>
    </div>
    {% endif %}

    <form method="post" action="/tenant/login">
      <div class="form-group">
        <label class="form-label" for="email">Administrator Email</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="admin@yourisp.com" value="{{ email or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn-submit">Sign In to Workspace</button>
    </form>

    <div class="footer-links">
      Need a new ISP tenant account? <a href="/checkout?plan=starter">Get Started</a>
    </div>
  </div>
</body>
</html>
